name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all

      - name: Check generated completions
        if: matrix.os == 'ubuntu-latest'
        run: |
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          bash scripts/generate-completions.sh "$output_dir"
          for extension in bash fish zsh ps1 elvish; do
            test -s "$output_dir/completions.$extension"
          done
          bash -n "$output_dir/completions.bash"
